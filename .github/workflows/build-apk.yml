name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the Rust protocol and local-AI test suite before building
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - 'feat/**'
    tags:
      - 'v*'
    paths-ignore:
      - 'catalog/**'
      - 'external/MajsoulMax-rs/liqi_config/max_data.yaml'
      - 'tools/update_unlock_catalog.py'
      - 'docs/unlock-catalog.md'

permissions:
  contents: write

jobs:
  build:
    name: Build ARM64 and universal APKs
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record build revision
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          printf 'Source ref: %s\nSource commit: %s\n' "$BUILD_REF" "$BUILD_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Check release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test -s "release-notes/$RELEASE_TAG.md"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install protobuf compiler and Lua test runtime
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lua5.1

      - name: Test Android emoji compatibility
        run: lua5.1 tools/tests/test_emoji_compat.lua

      - name: Test automatic operation safeguards
        run: lua5.1 tools/tests/test_auto_discard.lua

      - name: Verify versioned unlock catalog
        run: python3 tools/update_unlock_catalog.py --check

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            hook-probe/rust-modder -> ../build/rust
            hook-probe/rust-ai -> ../build/rust

      - name: Test local AI and protocol recovery
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        working-directory: hook-probe/rust-ai
        run: cargo test --release --locked --target-dir ../build/rust

      - name: Test Android modder and announcement passthrough
        working-directory: hook-probe/rust-modder
        run: cargo test --release --locked --target-dir ../build/rust

      - name: Test selected Mortal integration and feature regressions
        working-directory: external/Akagi/native_bot
        run: cargo test --release --locked --target-dir ../../../hook-probe/build/rust --lib --test mortal_feature_regressions --test mortal_ranking_regressions --test mortal_state_obs --test mortal_sanma_reference --test shanten_len_div3

      - name: Test native sanma SP algorithms
        working-directory: external/mortal-sp
        run: cargo test --release --locked --target-dir ../../hook-probe/build/rust --lib

      - name: Build Rust engines and native bridges for all ABIs
        # Native SP tests and complete sanma vectors run before packaging.
        shell: pwsh
        run: ./hook-probe/build-native.ps1 -NdkPath "$env:ANDROID_HOME/ndk/27.2.12479018" -Abis all

      - name: Upload AI dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-cargo-lock
          path: hook-probe/rust-ai/Cargo.lock
          retention-days: 7

      - name: Restore persistent APK signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ci-debug.keystore"
          else
            echo "Secret ANDROID_DEBUG_KEYSTORE_BASE64 not configured; generating ephemeral debug keystore for CI build..."
            keytool -genkey -v -keystore "$RUNNER_TEMP/ci-debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod 600 "$RUNNER_TEMP/ci-debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/ci-debug.keystore" -storepass android -alias androiddebugkey >/dev/null 2>&1

      - name: Build ARM64 and universal APKs
        env:
          ANDROID_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/ci-debug.keystore
        run: ./gradlew -p hook-probe --no-daemon -PupdateOwner=linyuanjianying -PupdateRepo=lsp-majsoul-unlock -PupdateChannel=stable -PbuildSha="${GITHUB_SHA:0:7}" assembleDebug

      - name: Verify native ABI completeness, dependencies and alignment
        shell: bash
        run: |
          python3 tools/verify_native_apk.py hook-probe/build/outputs/apk/arm64/debug/MajsoulHookProbe-arm64-debug.apk --abis arm64-v8a
          python3 tools/verify_native_apk.py hook-probe/build/outputs/apk/universal/debug/MajsoulHookProbe-universal-debug.apk --abis arm64-v8a armeabi-v7a x86 x86_64

      - name: Verify APK signature and alignment
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          for APK in hook-probe/build/outputs/apk/{arm64,universal}/debug/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$APK"
            CERTS="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")"
            ACTUAL_SHA256="$(awk -F': ' '/certificate SHA-256 digest:/ {print $2; exit}' <<< "$CERTS" | tr -d '[:space:]:' | tr 'A-F' 'a-f')"
            echo "$APK signing certificate SHA-256: $ACTUAL_SHA256"
            if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
              test "$ACTUAL_SHA256" = '375638284d8b7d9889ab3c0ed7afd0d597d2c648144813bb4936f37daa665c0f'
            else
              test -n "$ACTUAL_SHA256"
            fi
          done

      - name: Build Android controller and model contract tests
        env:
          ANDROID_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/ci-debug.keystore
        run: ./gradlew -p hook-probe --no-daemon -PbuildSha="${GITHUB_SHA:0:7}" assembleUniversalDebugAndroidTest

      - name: Enable KVM for Android tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test controllers, model contracts and JNI on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r hook-probe/build/outputs/apk/universal/debug/MajsoulHookProbe-universal-debug.apk
            adb install -r hook-probe/build/outputs/apk/androidTest/universal/debug/MajsoulHookProbe-universal-debug-androidTest.apk
            bash -o pipefail -c 'adb shell am instrument -w com.yefeng.majmax.hookprobe.test/com.yefeng.majmax.hookprobe.manager.AutoDiscardInstrumentation | tee instrumentation.log'
            grep -q 'controller checks passed' instrumentation.log

      # Bounded, redacted excerpt of the instrumented test output. Runs even when the
      # emulator step fails so the failure reason reaches the job summary; the emulator
      # step keeps its real non-zero status (no continue-on-error).
      - name: Summarize Android test failure
        if: failure()
        shell: bash
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          if [ ! -s instrumentation.log ]; then
            printf '### Android instrumented tests\n\nNo `instrumentation.log` was produced (device, install or instrumentation startup failure). Check the emulator step log.\n' >> "$SUMMARY"
            exit 0
          fi
          python3 - <<'PYERROR'
          import pathlib, re
          lines = pathlib.Path('instrumentation.log').read_text(errors='replace').splitlines()
          matches = [x[:350] for x in lines if re.search(r'Assertion|Exception|expected |FAIL|INSTRUMENTATION_FAILED', x)]
          for line in matches[:8]:
              if re.search(r'token|secret|password|Bearer|ghp_|github_pat_', line, re.I):
                  continue
              safe = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Android instrumentation::' + safe)
          PYERROR
          PASSES="$(grep -a -c '^PASS ' instrumentation.log || true)"
          FAILS="$(grep -a -c -E '(^|[[:space:]])FAIL' instrumentation.log || true)"
          {
            printf '### Android instrumented tests (bounded excerpt)\n\n'
            printf '`PASS` lines: %s, `FAIL` lines: %s\n\n' "${PASSES:-0}" "${FAILS:-0}"
            printf '```text\n'
            # Only lines carrying PASS/FAIL/assertion signatures, truncated to 400 chars each,
            # at most 40 lines. Arbitrary log content (tokens, env) is never echoed.
            grep -a -E '(^|[[:space:]])(FAIL|FAILURES|AssertionError|AssertionFailedError|IllegalStateException|NullPointerException|ClassCastException|expected [^ ]|java\.lang\.)|^INSTRUMENTATION_|^OK \(' instrumentation.log \
              | grep -a -v -E '(token|secret|password|api[_-]?key|Bearer|ghp_|github_pat_)' \
              | cut -c1-400 | head -n 40 || true
            printf '```\n'
            if [ "$(wc -l < instrumentation.log)" -gt 0 ]; then
              printf '\nLast 5 lines of the instrumented stream (truncated):\n\n```text\n'
              tail -n 5 instrumentation.log | cut -c1-300
              printf '```\n'
            fi
          } >> "$SUMMARY" 2>/dev/null || true

      - name: Upload APK artifacts
        # Publish the debug APKs whenever packaging succeeded, including when only a later
        # (non-release) step failed. Release tagging is handled by the publish steps below,
        # so this never creates a release or ships an empty artifact.
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: MajsoulHookProbe-arm64-and-universal-${{ github.sha }}
          path: |
            hook-probe/build/outputs/apk/arm64/debug/*.apk
            hook-probe/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APK="hook-probe/build/outputs/apk/universal/debug/MajsoulHookProbe-universal-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$($AAPT dump badging "$APK")"
          VERSION_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          VERSION_NAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          test "$GITHUB_REF_NAME" = "v$VERSION_NAME"
          RELEASE_APK="MajsoulMax-Hook-${VERSION_NAME}-universal.apk"
          ARM64_APK="MajsoulMax-Hook-${VERSION_NAME}-arm64-v8a.apk"
          cp "$APK" "$RELEASE_APK"
          cp hook-probe/build/outputs/apk/arm64/debug/MajsoulHookProbe-arm64-debug.apk "$ARM64_APK"
          cat > hook-update.json <<EOF
          {
            "schemaVersion": 1,
            "applicationId": "com.yefeng.majmax.hookprobe",
            "channel": "stable",
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "minSdk": 29,
            "abis": ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"],
            "releaseTag": "${GITHUB_REF_NAME}",
            "assetName": "${RELEASE_APK}",
            "variants": [
              {"assetName": "${ARM64_APK}", "abis": ["arm64-v8a"]},
              {"assetName": "${RELEASE_APK}", "abis": ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"]}
            ]
          }
          EOF

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            hook-update.json
            MajsoulMax-Hook-*-arm64-v8a.apk
            MajsoulMax-Hook-*-universal.apk
